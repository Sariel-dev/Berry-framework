  <!-- BERRY INVENTORY THEME SCRIPT -->
  <script>
    (() => {
      const root = document.documentElement;

      const clampChannel = (value) => {
        const number = Number(value);
        if (!Number.isFinite(number)) return null;
        return Math.min(255, Math.max(0, Math.round(number)));
      };

      const normalizeColor = (value) => {
        if (!value) return null;

        if (typeof value === 'string') {
          const hex = value.replace('#', '').trim();
          if (!/^[0-9a-fA-F]{6}$/.test(hex)) return null;

          return {
            r: parseInt(hex.slice(0, 2), 16),
            g: parseInt(hex.slice(2, 4), 16),
            b: parseInt(hex.slice(4, 6), 16),
          };
        }

        const red = clampChannel(value.r ?? value.R ?? value[1]);
        const green = clampChannel(value.g ?? value.G ?? value[2]);
        const blue = clampChannel(value.b ?? value.B ?? value[3]);

        if (red === null || green === null || blue === null) return null;

        return { r: red, g: green, b: blue };
      };

      const toHex = (color) =>
        `#${[color.r, color.g, color.b]
          .map((channel) => channel.toString(16).padStart(2, '0'))
          .join('')
          .toUpperCase()}`;

      const applyTheme = (payload) => {
        const color = normalizeColor(payload?.color ?? payload?.primaryColor);
        if (!color) return;

        const hex = typeof payload?.hex === 'string' && /^#?[0-9a-fA-F]{6}$/.test(payload.hex)
          ? (payload.hex.startsWith('#') ? payload.hex.toUpperCase() : `#${payload.hex.toUpperCase()}`)
          : toHex(color);

        root.style.setProperty('--global-main-color', hex);

        for (let step = 10; step <= 90; step += 10) {
          root.style.setProperty(
            `--global-main-color-${step}`,
            `rgba(${color.r}, ${color.g}, ${color.b}, ${step / 100})`
          );
        }
      };

      window.addEventListener('message', (event) => {
        const payload = event.data;
        if (!payload || payload.action !== 'theme:apply') return;
        applyTheme(payload);
      });

      applyTheme({ color: { r: 107, g: 33, b: 168 }, hex: '#6B21A8' });
    })();
  </script>
