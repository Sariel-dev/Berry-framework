<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prévisualisation Navigateur — Berry F1 NUI Menu</title>
    
    <!-- FONTS & ICONS -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Montserrat:wght@300;400;500;600;700;800;900&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <!-- BERRY MASTER STYLES -->
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('https://media.discordapp.net/attachments/1460008647538249748/1494044226051117106/image.png?ex=69e12c9d&is=69dfdb1d&hm=bda282ec448da4d1a7ee97e6b04e06ef37a9347ee9ee731d3e72640b310a5065&=');
            background-size: cover;
            background-position: center;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .preview-controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(15, 10, 25, 0.85);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid rgba(168, 85, 247, 0.3);
            display: flex;
            gap: 12px;
            z-index: 9999;
        }

        .preview-btn {
            background: linear-gradient(135deg, #a855f7, #6b21a8);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preview-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body>

    <!-- PREVIEW TEST CONTROLS -->
    <div class="preview-controls">
        <button class="preview-btn" onclick="toggleF1Menu()">🎮 Ouvrir / Fermer Menu F1</button>
        <button class="preview-btn" onclick="testNotification()">🔔 Test Notification</button>
        <button class="preview-btn" onclick="testProgressBar()">📊 Test Progress Bar</button>
    </div>

    <!-- BERRY NOTIFICATIONS CONTAINER -->
    <div id="berry-notifications-container"></div>

    <!-- BERRY PROGRESS BAR CONTAINER -->
    <div id="berry-progressbar-container" class="hidden">
        <div class="progressbar-wrapper">
            <div class="progressbar-header">
                <span id="progressbar-label">Action en cours...</span>
                <span id="progressbar-percentage">0%</span>
            </div>
            <div class="progressbar-bar">
                <div id="progressbar-fill"></div>
            </div>
        </div>
    </div>

    <!-- F1 MENU CONTAINER -->
    <div id="f1-container" class="hidden">
        <div class="menu-header">
            <h1 id="menu-title">BERRY</h1>
        </div>

        <div class="menu-subtitle-bar">
            <span id="menu-subtitle">Actions</span>
            <span id="menu-counter">1/5</span>
        </div>

        <div id="menu-items-list" class="menu-items-container">
            <!-- Dynamically populated buttons -->
        </div>
    </div>

    <script src="app.js"></script>

    <script>
        // Mock FiveM NUI Environment for Browser Testing
        window.GetParentResourceName = function() { return "berry-core"; };

        // Test Data
        const sampleMenuItems = [
            { label: "Informations Personnage", value: "Profil" },
            { label: "Entreprise & Métier", value: "Mécano" },
            { label: "Gestion Véhicule", value: "Moteur / Coffre" },
            { label: "Propriétés & Logements", value: "Mes Clés" },
            { label: "Animations & Démarches", value: "Emotes" },
            { label: "Touches du Serveur", value: "[F1] [F2] [E]" },
            { label: "Commandes RP", value: "/me /do" },
            { label: "Menu Staff & Modération", value: "Fondateur" }
        ];

        function toggleF1Menu() {
            const f1 = document.getElementById('f1-container');
            if (f1.classList.contains('hidden')) {
                openMenu("BERRY", "Menu Principal", sampleMenuItems);
            } else {
                closeMenu();
            }
        }

        function testNotification() {
            addBerryNotification({
                title: "BERRY FRAMEWORK",
                subtitle: "SYSTÈME NUI",
                message: "Bienvenue sur le nouveau Menu F1 NUI Violet de Berry Framework !",
                variant: "success",
                duration: 5000
            });
        }

        function testProgressBar() {
            startBerryProgressBar(4000, "Réparation du véhicule en cours...");
        }

        // Auto open on load for immediate preview
        window.addEventListener('DOMContentLoaded', () => {
            openMenu("BERRY", "Menu Principal", sampleMenuItems);
            testNotification();
        });
    </script>
</body>
</html>
